# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build MagicDatabase/MagicDatabase.csproj
      - name: Publish
        run: dotnet publish MagicDatabase/MagicDatabase.csproj -c Release -o published

